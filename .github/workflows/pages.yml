name: Publish Purchase Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build versioned website
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/build-release.mjs
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-release
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

